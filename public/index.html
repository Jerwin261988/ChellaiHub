<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chellai Japan Products</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#16202a;--mute:#66727e;--line:#e1e6eb;--brand:#1f6feb;--ok:#1a7f4b;--warn:#b7791f;--bad:#c53030;--chip:#eef2f6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f141a;--card:#18202a;--ink:#e8edf2;--mute:#8d99a6;--line:#2a3441;--brand:#5b9dff;--ok:#4cc38a;--warn:#e0b04a;--bad:#f07070;--chip:#222c38}}
:root[data-theme="dark"]{--bg:#0f141a;--card:#18202a;--ink:#e8edf2;--mute:#8d99a6;--line:#2a3441;--brand:#5b9dff;--ok:#4cc38a;--warn:#e0b04a;--bad:#f07070;--chip:#222c38}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:720px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
header b{font-size:20px}
.mute{color:var(--mute);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}
.tabs button{flex:1;white-space:nowrap}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 14px;cursor:pointer}
button.on,button.pri{background:var(--brand);border-color:var(--brand);color:#fff}
button.ok{background:var(--ok);border-color:var(--ok);color:#fff}
button.bad{background:var(--bad);border-color:var(--bad);color:#fff}
button.sm{padding:5px 10px;font-size:13px}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{text-align:center}.stat b{display:block;font-size:26px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.chip{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12px;background:var(--chip)}
.chip.approved{color:var(--ok)}.chip.pending{color:var(--warn)}.chip.rejected{color:var(--bad)}
.note{padding:10px;border-radius:10px;background:var(--chip);font-size:13px;margin-top:10px}
.note.err{color:var(--bad)}.note.good{color:var(--ok)}
table{width:100%;border-collapse:collapse}td{padding:6px 0}td:last-child{text-align:right}
tr.t td{border-top:1px solid var(--line);font-weight:600}
h3{margin:0 0 6px;font-size:16px}
#allprint{display:none}
@media print{body.print-all #app{display:none!important}body.print-all #allprint{display:block!important}.pgp{break-after:page;page-break-after:always}}
.fbtn{display:inline-block;position:relative;padding:9px 14px;border-radius:10px;background:var(--brand);color:#fff;cursor:pointer}.fbtn.out{background:var(--bad)}.fbtn input{position:absolute;left:0;top:0;opacity:0;width:100%;height:100%;cursor:pointer}
@media print{#app>*{display:none!important}#app>#sumwrap,#app>#slipwrap{display:block!important;overflow:visible!important}#app{padding:0;max-width:none}body{background:#fff}#sumwrap{page:sumpg}#slipwrap{page:slippg}}
@page sumpg{size:landscape;margin:8mm}
@page slippg{size:portrait;margin:12mm}
.grid3{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:6px}
.grid3 select,.grid3 input{padding:7px 6px;font-size:14px}
</style></head><body><div id="app"></div>

<div><label>Daily rate (₱)</label><input id="prate" type="number" data-in="pcalc" placeholder="uses employee rate"></div><div><label>Allowances (₱)</label><input id="pallow" type="number" data-in="pcalc"></div><div><label>Sales incentive (₱)</label><input id="pinc" type="number" data-in="pcalc"></div>
<div><label>SSS</label><input id="psss" type="number" data-in="pcalc"></div>
<div><label>Loan / cash advance</label><input id="pca" type="number" data-in="pcalc"><button class="sm" style="margin-top:6px" data-act="autoLoan">Use loan deduction</button></div></div>
<label>Other deductions</label><input id="poth" type="number" data-in="pcalc">
<div id="pnet" class="note">Net pay: ₱0.00</div>
<p><button class="pri" data-act="savePay">Publish payslip</button></p>`:`<p class="mute">Add an employee first.</p>`}</div>
<div class="card"><h3>Issued payslips</h3>${l.length?l.map(p=>`<div class="row"><div>${esc(p.name)}<div class="mute">${fd(p.start)} · ${peso(p.net)}</div></div><div><button class="sm" data-act="viewSlip" data-v="${p.id}">View</button> <button class="sm bad" data-act="delPay" data-v="${p.id}">Delete</button></div></div>`).join(""):`<p class="mute">None yet.</p>`}</div>`;
}

function info(){
  const s=me(),b=$("#linfo");if(!s||!b)return;
  const t=val("ltype"),n=countDays(val("lfrom"),val("lto"));
  let m=n?`${n} day${n>1?"s":""} (${ruleTxt()}). `:"Pick your dates. ";
  if(t!=="unpaid"){m+=eligible(s)?`You have ${left(s,t)} paid day(s) left this year.`:"Paid leave starts after 12 months of service. Choose unpaid leave instead."}
  else m+="Unpaid leave: no pay for these days."
  b.textContent=m;
}
function pcalc(){
  const s=staff.find(x=>x.id===val("pemp")),r=num("prate")||(s?rateOn(s,val("pstart")||today()):0),g=num("pdays")*r+num("pallow")+num("pinc");
  const n=g-num("psss")-num("pphil")-num("ppag")-num("pca")-num("poth");
  const b=$("#pnet");if(b)b.textContent="Net pay: "+peso(n)+" (gross "+peso(g)+")";
}
document.addEventListener("input",e=>{const k=e.target.dataset&&e.target.dataset.in;if(k==="info")info();if(k==="pcalc")pcalc()});
document.addEventListener("pointerdown",()=>{pressing=true});
["pointerup","pointercancel"].forEach(t=>document.addEventListener(t,()=>{pressing=false;setTimeout(()=>{if(dirty&&!document.activeElement.matches("input,select,textarea")){dirty=false;render()}},300)}));
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&(e.target.id==="lpin"||e.target.id==="lid")){e.preventDefault();const b=$("[data-act=login],[data-act=srvLogin]");if(b)b.click()}});
document.addEventListener("change",e=>{const k=e.target.dataset&&e.target.dataset.in;if(k==="info")info();if(k==="pcalc")pcalc();if(k==="adate"){view=e.target.value||null;editEmp=null;render()}if(k==="pweek"){payWeek=e.target.value||null;render()}if(k==="sssmode")setSss(payWeek||lastSun(),e.target.value);if(k==="sssemp")setSss(payWeek||lastSun(),null,e.target.dataset.e,e.target.checked);if(k==="cfg"){cfg={rule:e.target.value};try{db.collection("settings").doc("leave").set({rule:e.target.value})}catch(x){}render()}if(k==="rcsv")loadCsv(e.target);if(k==="wkchg"){wkEmp=val("wkemp");wkStart=val("wkstart")||null;render()}if(k==="wkall"){document.querySelectorAll(".wks").forEach(x=>{x.value=e.target.value})}if(k==="clockin"||k==="clockout"){const f=e.target.files&&e.target.files[0];if(f)clockPhoto(k==="clockin"?"in":"out",f);e.target.value=""}});

document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  const act=b.dataset.act,v=b.dataset.v;msg=null;
  try{
    if(act==="dismiss"){render()}
    else if(act==="adminGo"){adminMode=true;render()}
    else if(act==="clockIn"){
      if(previewId)return setMsg("Preview mode: nothing is saved.","err");
      const s=me();if(leaveOn(s.id,today()))return setMsg("You are on approved leave today.","err");if(attOf(s.id,today()))return setMsg("You already clocked in today.","err");
      await db.collection("attendance").doc("a_"+s.id+"_"+today()).set({empId:s.id,name:s.name,date:today(),in:Date.now(),out:null});
      setMsg("Clocked in at "+tm_(Date.now())+".","good");
    }
    else if(act==="clockOut"){
      if(previewId)return setMsg("Preview mode: nothing is saved.","err");
      const s=me(),r=attOf(s.id,today());if(!r||r.out)return setMsg("Nothing to clock out.","err");
      await db.collection("attendance").doc(r.id).update({out:Date.now()});
      setMsg("Clocked out at "+tm_(Date.now())+".","good");
    }
    else if(act==="editAtt"){editEmp=v||null;render();focusCard("attcard")}
    else if(act==="bulkAll"||act==="bulkNone"){document.querySelectorAll(".bk").forEach(x=>{x.checked=act==="bulkAll"})}
    else if(act==="bulkAtt"){
      const ids=[...document.querySelectorAll(".bk:checked")].map(x=>x.value),f=val("bfrom"),t=val("bto")||f,st=val("bstat");
      if(!ids.length)return setMsg("Select at least one employee.","err");
      if(!f||t<f)return setMsg("Choose a valid date range.","err");
      const ops=[];
      for(const id of ids){const e=staff.find(x=>x.id===id);for(let d=f;d<=t&&ops.length<2000;d=addDays(d,1))ops.push([id,e,d])}
      for(let i=0;i<ops.length;i+=20){
        await Promise.all(ops.slice(i,i+20).map(o=>{
          const id=o[0],e=o[1],d=o[2],key="a_"+id+"_"+d,ex=att.find(r=>r.id===key);
          if(st==="clear")return ex?db.collection("attendance").doc(key).delete():null;
          const rec={empId:id,name:e?e.name:id,date:d,in:null,out:null,imported:true};
          if(st==="off")rec.off=true;else if(st==="holiday")rec.holiday=true;else if(st==="absent")rec.absent=true;
          else{if(st==="half")rec.half=true;if(ex&&ex.in&&!ex.off&&!ex.absent&&!ex.holiday){rec.in=ex.in;rec.out=ex.out;rec.imported=!!ex.imported}}
          return db.collection("attendance").doc(key).set(rec);
        }));
      }
      setMsg("Attendance updated: "+ids.length+" employee(s), "+ops.length+" day record(s).","good");
    }
    else if(act==="saveAtt"){
      const d=view||today(),i=val("ein"),o=val("eout"),st=val("est"),s=staff.find(x=>x.id===v),ex=dayRec(v,d);
      const rec={empId:v,name:s?s.name:v,date:d,in:null,out:null,imported:true};
      if(st==="off")rec.off=true;else if(st==="holiday")rec.holiday=true;else if(st==="absent")rec.absent=true;
      else{
        if(st==="half")rec.half=true;
        if(i){const ti=new Date(d+"T"+i).getTime(),to=o?new Date(d+"T"+o).getTime():null;if(to&&to<ti)return setMsg("Time out must be after time in.","err");rec.in=ti;rec.out=to;rec.imported=false}
        else if(ex&&ex.in&&!ex.off&&!ex.absent&&!ex.holiday){rec.in=ex.in;rec.out=ex.out;rec.imported=!!ex.imported}
      }
      await db.collection("attendance").doc("a_"+v+"_"+d).set(rec);
      editEmp=null;setMsg("Attendance saved.","good");
    }
    else if(act==="delAtt"){
      await db.collection("attendance").doc("a_"+v+"_"+(view||today())).delete();
      editEmp=null;setMsg("Marked absent.","good");
    }
    else if(act==="saveLoan"){
      const s=staff.find(x=>x.id===val("lemp")),amt=num("lamt");
      if(!s||amt<=0||!val("ldate"))return setMsg("Choose the employee, amount and date.","err");
      await db.collection("loans").doc(uid("n")).set({empId:s.id,name:s.name,amount:amt,weekly:num("lweek")||amt,date:val("ldate"),first:val("lfirst")||val("ldate"),note:val("lnote").trim(),payments:[]});
      setMsg("Loan saved for "+s.name+".","good");
    }
    else if(act==="delLoan"){
      const l=loans.find(x=>x.id===v);
      if(l&&(l.payments||[]).length)return setMsg("This loan already has deductions, so it cannot be deleted.","err");
      await db.collection("loans").doc(v).delete();
    }
    else if(act==="autoLoan"){
      const id=val("pemp");if(!id)return;
      const d=loanDueOf(id,val("pstart")||payWeek||lastSun());$("#pca").value=d?d.toFixed(2):"";pcalc();
    }
    else if(act==="runPayroll"){
      const w=payWeek||lastSun();
      if(new Date(w+"T00:00").getDay()!==0)return setMsg("Week start must be a Sunday.","err");
      let n=0;
      for(const s of staff.filter(x=>live(x,w))){
        if(pays.some(p=>p.empId===s.id&&p.start===w))continue;
        const c=calc(s,w);if(c.days<=0)continue;
        const pid=uid("p");
        const wb=weekBreak(s.id,w);
        await db.collection("payslips").doc(pid).set({wd:wb.wd,vl:wb.vl,sl:wb.sl,ab:wb.ab,vlAmt:wb.vl*c.rate,slAmt:wb.sl*c.rate,addl:c.allow+c.addl,adv:c.adv,gift:c.gift,valuable:c.valuable,gas:c.gas,empId:s.id,name:s.name,start:w,days:c.days,rate:c.rate,allow:c.allow+c.addl,inc:c.inc,gross:c.gross,sss:c.sss,ca:c.loan,other:c.other,net:c.net,auto:true});
        let rem=c.loan;
        for(const l of activeOf(s.id)){const x=Math.min(loanDue(l,w),rem);if(x<=0.004)continue;await db.collection("loans").doc(l.id).update({payments:(l.payments||[]).concat([{date:w,amount:x,slip:pid}])});rem-=x}
        for(const a of adjIn(s.id,w))await db.collection("adjust").doc(a.id).update({slip:pid});
        n++;
      }
      setMsg(n?"Payroll published for "+n+" employee"+(n>1?"s":"")+".":"Nothing to publish for this week.",n?"good":"err");
    }
    else if(act==="saveSale"){
      const a=num("slamt");
      if(a<=0||!val("sldate"))return setMsg("Enter the date and sales amount.","err");
      await db.collection("sales").doc(uid("s")).set({branch:val("slbranch"),date:val("sldate"),amount:a,note:val("slnote").trim()});
      setMsg("Sales saved for "+val("slbranch")+".","good");
    }
    else if(act==="addNoDay"){
      const d=val("ndate");if(!d)return setMsg("Choose the date to exclude.","err");
      for(const b of (val("nbranch")==="Both"?BR:[val("nbranch")]))await db.collection("nodays").doc(b+"_"+d).set({branch:b,date:d,reason:val("nreason").trim()});
      setMsg("That day is now excluded from incentives for the selected branch.","good");
    }
    else if(act==="delNoDay"){await db.collection("nodays").doc(v).delete()}
    else if(act==="saveIncCfg"){
      await db.collection("settings").doc("incentive").set({pct:num("icp"),target:num("ict")});
      setMsg("Incentive rules saved.","good");
    }
    else if(act==="delSale"){await db.collection("sales").doc(v).delete()}
    else if(act==="rweek"){rWeek=addDays(rWeek||(isAdmin&&!previewId&&!meId?addDays(thisSun(),7):thisSun()),Number(v));render()}
    else if(act==="rcopy"){
      for(const g of document.querySelectorAll(".grid3")){const r=rosOf(g.dataset.e,addDays(g.dataset.d,-7));if(r){g.querySelector(".rs").value=r.status;g.querySelector(".rb").value=r.branch||"";g.querySelector(".rr").value=r.role||""}}
    }
    else if(act==="saveRoster"){
      let n=0,del=0;
      for(const g of document.querySelectorAll(".grid3")){
        const id=g.dataset.e,d=g.dataset.d,st=g.querySelector(".rs").value,br=g.querySelector(".rb").value,ro=g.querySelector(".rr").value.trim(),e=staff.find(x=>x.id===id),ex=rosOf(id,d),role=ro||(e&&e.pos)||"";
        if(!st){if(ex){await db.collection("roster").doc(id+"_"+d).delete();del++}continue}
        if(ex&&ex.status===st&&(ex.branch||"")===br&&(ex.role||"")===role)continue;
        await db.collection("roster").doc(id+"_"+d).set({empId:id,name:e?e.name:id,date:d,status:st,branch:br,role:role});n++;
      }
      setMsg("Roster published: "+n+" day(s) saved"+(del?", "+del+" cleared":"")+".","good");
    }
    else if(act==="resetImport"){impMsg="Clearing…";render();await runReset()}
    else if(act==="runImport"){impMsg="Starting…";render();await runImport()}
    else if(act==="applyInc"){
      const w=payWeek||lastSun();let n=0;
      for(const r of payRows(w)){
        if(r.pid&&r.inc!==r.ci){const p0=pays.find(x=>x.id===r.pid);await db.collection("payslips").doc(r.pid).update({inc:r.ci,gross:(p0.gross||0)-(p0.inc||0)+r.ci,net:(p0.net||0)-(p0.inc||0)+r.ci});n++}
      }
      setMsg("Sales incentive added to "+n+" payslip(s).","good");
    }
    else if(act==="viewSlip"){slipId=v;tab="slip";render()}
    else if(act==="slipPrint"){try{window.print()}catch(x){setMsg("Printing is blocked here. Use Download.","err")}}
    else if(act==="slipDownload"){
      const p=pays.find(x=>x.id===v),e=p&&staff.find(x=>x.id===p.empId),dl=await claude.use("downloads");
      if(!p||!e)return setMsg("Payslip not found.","err");
      if(!dl)return setMsg("Downloads are not available in this view.","err");
      try{const buf=await pdfSave('<div class="slip">'+slipBody(p,e)+'</div>',slipCss(),false);await dl.save({filename:"payslip-"+e.id+"-"+p.start+".pdf",data:buf});return}catch(x){if(x&&x.code==="declined")return}
      const doc='<!DOCTYPE html><html><head><meta charset="utf-8"><title>Payslip '+e.id+' '+p.start+'</title><style>'+slipCss()+'body{margin:12px;background:#fff}.noprint{margin-bottom:10px}@media print{.noprint{display:none}}@page{size:portrait;margin:12mm}</style></head><body><button class="noprint" onclick="window.print()">Print</button><div class="slip">'+slipBody(p,e)+'</div></body></html>';
      try{await dl.save({filename:"payslip-"+e.id+"-"+p.start+".html",data:doc})}catch(x){if(!x||x.code!=="declined")setMsg("Could not save the file"+(x&&x.message?": "+x.message:"")+".","err")}
    }
    else if(act==="allPrint"||act==="allPdf"){
      const w=payWeek||lastSun(),list=pays.filter(p=>p.start===w).sort((a,b)=>String(a.empId).localeCompare(String(b.empId),undefined,{numeric:true}));
      if(!list.length)return setMsg("There are no published payslips for the week starting "+fd(w)+".","err");
      const sl=list.map(p=>'<div class="slip">'+slipBody(p,staff.find(x=>x.id===p.empId)||{id:p.empId,name:p.name,sick:0,vac:0})+'</div>'),pages=[];
      for(let i=0;i<sl.length;i+=2)pages.push('<div class="pgp">'+sl.slice(i,i+2).join("")+'</div>');
      const css=slipCss()+".pgp .slip{padding:6px 14px;margin:0 auto 14px}";
      if(act==="allPrint"){
        let el=document.getElementById("allprint");if(!el){el=document.createElement("div");el.id="allprint";document.body.appendChild(el)}
        el.innerHTML="<style>"+css+"</style>"+pages.join("");
        document.body.classList.add("print-all");
        window.onafterprint=()=>{document.body.classList.remove("print-all");el.innerHTML=""};
        try{window.print()}catch(x){document.body.classList.remove("print-all");setMsg("Printing is blocked here. Use Save all payslips as PDF.","err")}
      }else{
        const dl=await claude.use("downloads");if(!dl)return setMsg("Downloads are not available in this view.","err");
        try{const buf=await pdfSave(pages,css,false);await dl.save({filename:"payslips-"+w+".pdf",data:buf})}catch(x){if(!x||x.code!=="declined")setMsg("The PDF could not be made here: "+((x&&x.message)||"try Print instead")+".","err")}
      }
    }
    else if(act==="sumPrint"){try{window.print()}catch(x){setMsg("Printing is blocked here. Use Download printable file.","err")}}
    else if(act==="sumDownload"){
      const w=payWeek||lastSun(),dl=await claude.use("downloads");
      if(!dl)return setMsg("Downloads are not available in this view.","err");
      try{const buf=await pdfSave('<div class="psheet">'+sumTable(w)+'</div>',sumCss(),true);await dl.save({filename:"payroll-summary-"+w+".pdf",data:buf});return}catch(x){if(x&&x.code==="declined")return}
      const doc='<!DOCTYPE html><html><head><meta charset="utf-8"><title>Payroll summary '+w+'</title><style>'+sumCss()+'body{margin:12px;background:#fff}.noprint{margin-bottom:10px}@media print{.noprint{display:none}}@page{size:landscape;margin:8mm}</style></head><body><button class="noprint" onclick="window.print()">Print</button><div class="psheet">'+sumTable(w)+'</div></body></html>';
      try{await dl.save({filename:"payroll-summary-"+w+".html",data:doc})}catch(x){if(!x||x.code!=="declined")setMsg("Could not save the file"+(x&&x.message?": "+x.message:"")+".","err")}
    }
    else if(act==="autoDays"){
      const id=val("pemp"),st=val("pstart");if(!id||!st)return setMsg("Choose the employee and week start first.","err");
      $("#pdays").value=attDays(id,st);pcalc();
    }
    else if(act==="preview"){previewId=v;tab="home";view=null;render()}
    else if(act==="exitPrev"){previewId=null;tab="staff";view=null;render()}
    else if(act==="tab"){tab=v;view=null;editEmp=null;render()}
    else if(act==="open"){tab="slips";view=v||null;render()}
    else if(act==="toggleAdm"){viewAdmin=!viewAdmin;tab=viewAdmin?"req":"home";view=null;editEmp=null;render()}
    else if(act==="logout"){await hubPost("/api/logout");location.reload();return;meId=null;viewAdmin=false;adminMode=false;showSetup=false;try{sessionStorage.removeItem("hub_admin")}catch(x){}try{sessionStorage.removeItem("hub_me")}catch(x){}view=null;tab=isAdmin?"req":"home";render()}
    else if(act==="srvLogin"){
      const r=await hubPost("/api/login",{id:val("lid").trim(),password:val("lpin")});
      if(r.ok)location.reload();else{window.__lid=val("lid").trim();setMsg((await hubErr(r))||"Sign in failed.","err")}
    }
    else if(act==="login"){
      const raw=val("lid").trim(),pw=val("lpin"),ca=creds.find(x=>x.id==="admin");
      if(ca&&raw.toLowerCase()===String(ca.user).toLowerCase()){
        if((await hash(pw,ca.salt))!==ca.hash)return setMsg("Username or password is incorrect.","err");
        if(!isAdmin)return setMsg("This account cannot open the admin area from here.","err");
        adminMode=true;try{sessionStorage.setItem("hub_admin","1")}catch(x){}tab="req";render();return;
      }
      const id=raw.toUpperCase(),s=staff.find(x=>x.id===id),c=creds.find(x=>x.id===id);
      if(s&&!live(s,today()))return setMsg("This account is no longer active. Please contact your admin.","err");
      let ok=false;
      if(s&&id!=="ADMIN"){ok=c?(await hash(pw,c.salt))===c.hash:(String(s.pin||"")!==""&&String(s.pin)===pw.trim())}
      if(ok){meId=id;try{sessionStorage.setItem("hub_me",id)}catch(x){}tab="home";render()}
      else setMsg("Username or password is incorrect.","err");
    }
    else if(act==="adminLogin"){
      const c=creds.find(x=>x.id==="admin");
      if(c&&val("au").trim().toLowerCase()===String(c.user).toLowerCase()&&(await hash(val("ap"),c.salt))===c.hash){adminMode=true;try{sessionStorage.setItem("hub_admin","1")}catch(x){}tab="req";render()}
      else setMsg("Username or password is incorrect.","err");
    }
    else if(act==="adminForgot"){if(user&&user.isOwner()){showSetup=true;render()}}
    else if(act==="adminCancel"){showSetup=false;render()}
    else if(act==="adminSetup"){
      const c=creds.find(x=>x.id==="admin"),u=val("au").trim(),pw=val("ap");
      if(c&&!(showSetup&&user&&user.isOwner()))return setMsg("The admin account already exists.","err");
      if(u.length<3)return setMsg("Username must be at least 3 characters.","err");
      if(pw.length<6)return setMsg("Password must be at least 6 characters.","err");
      if(pw!==val("ap2"))return setMsg("The passwords do not match.","err");
      await setCred("admin",pw,{user:u});
      showSetup=false;adminMode=true;try{sessionStorage.setItem("hub_admin","1")}catch(x){}tab="req";setMsg("Admin account saved.","good");
    }
    else if(act==="chgPw"){
      if(previewId)return setMsg("Preview mode: nothing is saved.","err");
      const n1=val("pw1");
      if(n1.length<6)return setMsg("New password must be at least 6 characters.","err");
      if(n1!==val("pw2"))return setMsg("The new passwords do not match.","err");
      const r=await hubPost("/api/password",{current:val("pw0"),next:n1});
      if(r.ok)setMsg("Password changed.","good");else setMsg((await hubErr(r))||"Could not change the password.","err");
    }
    else if(act==="chgAdmin"){
      const n1=val("pw1");
      if(n1&&n1!==val("pw2"))return setMsg("The new passwords do not match.","err");
      const r=await hubPost("/api/admin-account",{username:val("au2").trim(),current:val("pw0"),next:n1});
      if(r.ok)setMsg("Admin account updated.","good");else setMsg((await hubErr(r))||"Could not update the account.","err");
    }
    else if(act==="applyLeave"){
      if(previewId)return setMsg("Preview mode: requests are not sent.","err");const s=me(),t=val("ltype"),f=val("lfrom"),to=val("lto"),n=countDays(f,to);
      if(!n)return setMsg("Please choose valid dates. The To date cannot be before the From date.","err");
      if(t!=="unpaid"){
        if(!eligible(s))return setMsg("Paid leave starts after 12 months of service. Please apply for unpaid leave.","err");
        if(n>left(s,t))return setMsg("You only have "+left(s,t)+" paid day(s) left. Apply the extra days as unpaid leave.","err");
      }
      await db.collection("leaves").doc(uid("l")).set({empId:s.id,name:s.name,type:t,from:f,to:to,days:n,reason:val("lreason").trim(),status:"pending",created:Date.now()});
      setMsg("Request sent. Your admin will review it.","good");
    }
    else if(act==="decide"){await db.collection("leaves").doc(v).update({status:b.dataset.s})}
    else if(act==="resetPw"){editStaff=v;render();focusCard("pwcard")}
    else if(act==="setPw"){
      const e=staff.find(x=>x.id===v),p1=val("rpw1");
      if(!e)return;
      if(p1.length<4)return setMsg("Password must be at least 4 characters.","err");
      if(p1!==val("rpw2"))return setMsg("The passwords do not match.","err");
      await setCred(v,p1);
      await db.collection("history").doc(uid("h")).set({empId:v,name:e.name,at:Date.now(),by:(user&&(user.name||user.displayName||user.email))||"Admin",field:"Password reset",from:"",to:"",eff:""});
      setMsg("Password changed for "+e.name+".","good");
    }
    else if(act==="editStaff"){editStaff=v||null;render();focusCard("staffcard")}
    else if(act==="saveStaff"){
      const id=val("sid").trim().toUpperCase().replace(/[^A-Z0-9_-]/g,""),nm=val("sname").trim();
      if(!id||!nm||(!staff.find(x=>x.id===id)&&!val("spin").trim()))return setMsg("ID, name and password are required.","err");
      if(id==="ADMIN")return setMsg("That ID is reserved.","err");
      if(val("spin").trim()&&val("spin").trim().length<4)return setMsg("Password must be at least 4 characters.","err");
      const nr=num("srate");if(val("srate")==="")return setMsg("Enter the daily rate (0 if none).","err");
      const old=staff.find(x=>x.id===id);
      let rates=old&&old.rates&&old.rates.length?old.rates.slice():(old&&old.rate?[{from:"1900-01-01",rate:old.rate}]:[]);
      rates.sort((a,b)=>a.from.localeCompare(b.from));
      const prevRate=rates.length?rates[rates.length-1].rate:null;
      if(!rates.length)rates=[{from:"1900-01-01",rate:nr}];
      else if(nr!==rates[rates.length-1].rate){const f=val("sfrom")||today();rates=rates.filter(r=>r.from!==f).concat([{from:f,rate:nr}]).sort((a,b)=>a.from.localeCompare(b.from))}
      const by=meId&&me()&&viewAdmin?me().name:((user&&(user.name||user.displayName||user.email))||"Admin"),ch=[],pu=(f,a,b,e)=>ch.push({f:f,a:a==null?"":String(a),b:b==null?"":String(b),e:e||""});
      const sp=val("spos").trim(),sh=val("shire"),sa=num("sallow"),ss=num("ssss"),so=$("#ssson").checked,sk=num("ssick"),sv=num("svac"),si=$("#sinc").checked,rs=$("#sres").checked,ad=$("#sadm").checked;
      if(!old)pu("Employee added","","Starting rate "+peso(nr));
      else{
        if(prevRate!==null&&nr!==prevRate)pu("Daily rate",peso(prevRate),peso(nr),val("sfrom")||today());
        if(old.name!==nm)pu("Name",old.name,nm);
        if((old.pos||"")!==sp)pu("Position",old.pos||"",sp);
        if((old.hire||"")!==sh)pu("Date hired",old.hire?fd(old.hire):"",sh?fd(sh):"");
        if((old.allow||0)!==sa)pu("Weekly allowance",peso(old.allow||0),peso(sa));
        if((old.sss||0)!==ss)pu("SSS / month",peso(old.sss||0),peso(ss));
        if(!!old.sssOn!==so)pu("SSS deduction",old.sssOn?"On":"Off",so?"On":"Off");
        if(!!old.incOn!==si)pu("Sales incentive",old.incOn?"Eligible":"Not eligible",si?"Eligible":"Not eligible");
        if(!!old.isAdm!==ad)pu("Admin access",old.isAdm?"Yes":"No",ad?"Yes":"No");
        if(!!old.resigned!==rs)pu(rs?"Resigned":"Reinstated","",rs?"Last working day "+fd(val("sresd")||today()):"");
        if((old.sick==null?5:old.sick)!==sk)pu("Sick leave days / year",old.sick==null?5:old.sick,sk);
        if((old.vac==null?5:old.vac)!==sv)pu("Vacation days / year",old.vac==null?5:old.vac,sv);
        if(val("spin").trim())pu("Password reset","","");
      }
      await db.collection("staff").doc(id).set({name:nm,pos:val("spos").trim(),hire:val("shire"),rate:rates[rates.length-1].rate,rates:rates,sick:num("ssick"),vac:num("svac"),allow:num("sallow"),sss:num("ssss"),sssOn:$("#ssson").checked,incOn:$("#sinc").checked,isAdm:$("#sadm").checked,resigned:$("#sres").checked,resignDate:$("#sres").checked?(val("sresd")||today()):"",pin:val("spin").trim()?"":((old&&old.pin)||"")});
      if(val("spin").trim())await setCred(id,val("spin").trim());
      for(const c of ch)await db.collection("history").doc(uid("h")).set({empId:id,name:nm,at:Date.now(),by:by,field:c.f,from:c.a,to:c.b,eff:c.e});
      editStaff=null;setMsg("Saved "+nm+".","good");
    }
    else if(act==="savePay"){
      const s=staff.find(x=>x.id===val("pemp"));
      if(!s||!val("pstart")||!num("pdays"))return setMsg("Choose employee, week start and days worked.","err");
      const rate=num("prate")||rateOn(s,val("pstart"))||0,allow=num("pallow"),inc=num("pinc"),gross=num("pdays")*rate+allow+inc;
      const d={sss:num("psss"),phil:num("pphil"),pagibig:num("ppag"),ca:num("pca"),other:num("poth")};
      const net=gross-d.sss-d.phil-d.pagibig-d.ca-d.other;
      const pid=uid("p");
      await db.collection("payslips").doc(pid).set(Object.assign({empId:s.id,name:s.name,start:val("pstart"),days:num("pdays"),rate,allow,inc,gross,net},d));
      let rem=d.ca;
      for(const l of activeOf(s.id)){if(rem<=0.004)break;const x=Math.min(rem,balOf(l));await db.collection("loans").doc(l.id).update({payments:(l.payments||[]).concat([{date:val("pstart"),amount:x,slip:pid}])});rem-=x}
      setMsg("Payslip published for "+s.name+".","good");
    }
    else if(act==="delPay"){
      for(const l of loans){if((l.payments||[]).some(p=>p.slip===v)){await db.collection("loans").doc(l.id).update({payments:l.payments.filter(p=>p.slip!==v)})}}
      for(const a of adj){if(a.slip===v)await db.collection("adjust").doc(a.id).update({slip:null})}
      await db.collection("payslips").doc(v).delete();
    }
    else if(act==="backupSave"){
      const dl=await claude.use("downloads");if(!dl)return setMsg("Downloads are not available in this view.","err");
      const b=backupData(),n=Object.values(b.data).reduce((a,c)=>a+Object.keys(c).length,0);
      try{await dl.save({filename:"hub-backup-"+today()+".json",data:JSON.stringify(b)});bkMsg="Backup file ready ("+n+" records).";render()}catch(x){if(!x||x.code!=="declined")setMsg("Could not save the file"+(x&&x.message?": "+x.message:"")+".","err")}
    }
    else if(act==="backupCheck"){
      const el=document.getElementById("bkfile"),f=el&&el.files&&el.files[0];
      if(!f)return setMsg("Choose a backup file first.","err");
      let b;try{b=JSON.parse(await f.text())}catch(x){return setMsg("That file is not a valid backup.","err")}
      if(!b||b.app!=="company-hub"||!b.data)return setMsg("That file is not a Company Hub backup.","err");
      const n=Object.values(b.data).reduce((a,c)=>a+Object.keys(c).length,0);
      bkPending=b;bkMsg="Backup from "+new Date(b.at).toLocaleString("en-PH")+" with "+n+" records. Restoring replaces all current data. Tap Confirm restore to continue.";render();
    }
    else if(act==="backupCancel"){bkPending=null;bkMsg="";render()}
    else if(act==="backupConfirm"){const b=bkPending;bkPending=null;if(b)await doRestore(b)}
    else if(act==="showPhoto"){
      const sn=await db.collection("photos").doc(v).get();
      if(!sn.exists)return setMsg("No photo found for that entry.","err");
      const x=sn.data();photoView={title:x.name+" · "+(x.kind==="in"?"Time in":"Time out")+" · "+new Date(x.at).toLocaleString("en-PH"),img:x.img};render();focusCard("photocard");
    }
    else if(act==="closePhoto"){photoView=null;render()}
    else if(act==="purgePhotos"){
      const q=await db.collection("photos").where("date","<",addDays(today(),-60)).get();let n=0;
      for(const d of q.docs){await db.collection("photos").doc(d.id).delete();n++}
      setMsg("Deleted "+n+" photo(s) older than 60 days.","good");
    }
    else if(act==="goWeek"){focusCard("wkcard")}
    else if(act==="goBulk"){focusCard("bulkcard")}
    else if(act==="saveWeek"){
      const id=v,e=staff.find(x=>x.id===id);if(!e)return setMsg("Choose an employee.","err");
      const ops=[];document.querySelectorAll(".wks").forEach(sel=>{if(sel.value)ops.push([sel.dataset.d,sel.value])});
      if(!ops.length)return setMsg("Choose a status for at least one day.","err");
      let n=0;
      for(const o of ops){
        const d=o[0],st=o[1],key="a_"+id+"_"+d,ex=att.find(r=>r.id===key);
        if(st==="clear"){if(ex){await db.collection("attendance").doc(key).delete();n++}continue}
        const cu=ex?(ex.off?"off":ex.absent?"absent":ex.half?"half":"present"):"";if(cu===st)continue;
        const rec={empId:id,name:e.name,date:d,in:null,out:null,imported:true};
        if(st==="off")rec.off=true;else if(st==="absent")rec.absent=true;
        else{if(st==="half")rec.half=true;if(ex&&ex.in&&!ex.off&&!ex.absent){rec.in=ex.in;rec.out=ex.out;rec.imported=!!ex.imported;if(ex.photoIn)rec.photoIn=true;if(ex.photoOut)rec.photoOut=true}}
        await db.collection("attendance").doc(key).set(rec);n++;
      }
      setMsg("Week saved for "+e.name+": "+n+" day(s) changed.","good");
    }
    else if(act==="saveAdj"){
      const e=staff.find(x=>x.id===val("aemp")),amt=num("aamt");
      if(!e||amt<=0||!val("adt"))return setMsg("Choose the employee, date and amount.","err");
      await db.collection("adjust").doc(uid("j")).set({empId:e.id,name:e.name,kind:val("akind"),date:val("adt"),amount:amt,note:val("anote").trim(),slip:null,at:Date.now()});
      setMsg("Saved. It goes on the payslip for the week of "+fd(val("adt"))+".","good");
    }
    else if(act==="delAdj"){await db.collection("adjust").doc(v).delete()}
  }catch(err){setMsg("That did not save: "+(err&&err.message||"permission or connection problem")+".","err")}
});
start();
</script></body></html>
